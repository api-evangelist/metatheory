aid: metatheory
name: Metatheory
description: Metatheory, Inc. is an independent studio of builders that makes games
  and, through an AI-led software division, tools built for makers. The team describes
  itself as builders, dreamers and doers applying what they have learned making games
  to software, building in public and sharing what they learn. Metatheory has been
  surfaced as a portfolio company of a16z and Pantera Capital and added to the API
  Evangelist network. As of this enrichment pass the public site (metatheory.gg) is
  a single-page marketing site with no developer portal, documentation, API, OpenAPI,
  SDK, or public developer surface; the only public contact is support@metatheory.gg.
